# Federated plugin monorepo created by `zfa package create-plugin` (issue #1604).
name: html_to_markdown_ffi
description: >-
  Typed HTML to Markdown conversion for the Zuraffa ecosystem: a Rust FFI core behind a pure-Dart converter port with federated native adapters.
version: 1.2.9
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0

dependencies:
  ffi: ^2.1.0
  http: ^1.4.0
  zorphy_annotation: ^2.4.4
  zuraffa: ^7.3.0
  # The shared, Flutter-free core: the port contract, the native-library
  # loader, and the in-process conversion bridge. It asks for no Flutter
  # SDK, so this package stays resolvable for a consumer that is not a
  # Flutter app.
  html_to_markdown_ffi_platform: ^1.2.9

dev_dependencies:
  build_runner: ^2.16.0
  lints: ^4.0.0
  test: ^1.25.0

repository: https://github.com/arrrrny/html_to_markdown_ffi
issue_tracker: https://github.com/arrrrny/html_to_markdown_ffi/issues

topics:
  - html-to-markdown-ffi
  - clean-architecture
  - zuraffa

# This package asks for no Flutter SDK and carries no plugin manifest, so a
# consumer with a plain Dart SDK can resolve it. The Flutter plugin — the
# package that names the platform adapters and links the native library in —
# is `html_to_markdown_ffi_flutter`.
#
# A Flutter app depends on `html_to_markdown_ffi_flutter`, which depends on
# this one. A CLI, a server, or a worker depends on this one alone.




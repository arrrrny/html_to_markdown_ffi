# Federated plugin monorepo created by `zfa package create-plugin` (issue #1604).
name: html_to_markdown_ffi
description: >-
  Typed HTML to Markdown conversion for the Zuraffa ecosystem: a Rust FFI core behind a pure-Dart converter port with federated native adapters.
version: 1.2.3
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"


dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  http: ^1.4.0
  zorphy_annotation: ^2.4.4
  zuraffa: ^7.2.0
  html_to_markdown_ffi_platform: ^1.2.3
  html_to_markdown_ffi_android: ^1.2.3
  html_to_markdown_ffi_ios: ^1.2.3
  html_to_markdown_ffi_macos: ^1.2.3

dev_dependencies:
  build_runner: ^2.16.0
  lints: ^4.0.0
  test: ^1.25.0

repository: https://github.com/arrrrny/html_to_markdown_ffi
issue_tracker: https://github.com/arrrrny/html_to_markdown_ffi/issues

topics:
  - html-to-markdown-ffi
  - clean-architecture
  - zuraffa

flutter:
  plugin:
    platforms:
      android:
        default_package: html_to_markdown_ffi_android
      ios:
        default_package: html_to_markdown_ffi_ios
      macos:
        default_package: html_to_markdown_ffi_macos

resolution: workspace

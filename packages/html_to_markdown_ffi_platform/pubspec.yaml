# Federated plugin monorepo created by `zfa package create-plugin` (issue #1604).
name: html_to_markdown_ffi_platform
description: >-
  Typed HTML to Markdown conversion for the Zuraffa ecosystem: a Rust FFI core behind a pure-Dart converter port with federated native adapters.
version: 1.2.4
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0


dependencies:
  zuraffa: ^7.2.0
  # The native-library loader and the shared conversion bridge need dart:ffi
  # and one HTTP client for the download fallback.
  ffi: ^2.1.0
  http: ^1.4.0
  # The channel envelope is shared with the rest of the Zuraffa FFI family
  # instead of being re-implemented per family.
  zuraffa_ffi_platform: ^0.2.1

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

repository: https://github.com/arrrrny/html_to_markdown_ffi
issue_tracker: https://github.com/arrrrny/html_to_markdown_ffi/issues

topics:
  - html-to-markdown-ffi
  - clean-architecture
  - zuraffa


resolution: workspace
